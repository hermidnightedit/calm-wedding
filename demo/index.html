<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calm Wedding">
<title>Calm Wedding Planner · Her Midnight Edit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EF;--card:#FFFDF9;--text:#1B2036;--muted:#6E6A5E;--faint:#A39C8C;--line:#E8DFCE;--line2:#D8CCB4;--accent:#8A6F3A;--gold:#C9A464;--rose:#C97F8C;--navy:#121830;--ok:#5E7A50;--okbg:#E4EBDC;--warn:#A35F5A;--warnbg:#F5E2DF;--amb:#8C6E3C;--ambbg:#F5EDDA;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--shadow:0 10px 24px -16px rgba(18,24,48,.35)}
[data-theme=dark]{--bg:#0E1222;--card:#161B30;--text:#EEE8DC;--muted:#A9A290;--faint:#6F6A5E;--line:#262C45;--line2:#343B5A;--accent:#D4B172;--gold:#D4B172;--okbg:#22301F;--ok:#9BBE88;--warnbg:#3A2226;--warn:#E09A93;--ambbg:#3A3020;--amb:#E0BE7E;--shadow:0 10px 24px -16px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
#main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:600}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:17px}
.brand small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);text-align:center}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.08;margin:4px 0}
h1 em,h2 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.link{font-size:13px;color:var(--accent);font-weight:500}
.hint{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.hero{text-align:center;padding:26px 18px 22px;background:var(--navy);color:#F3ECDF;border:0;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:10px;border:1px solid rgba(201,164,100,.45);border-radius:14px;pointer-events:none}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:#F3ECDF;font-size:38px;margin-top:6px}
.hero h1 em{color:var(--gold)}
.hero .days{font-family:var(--serif);font-size:64px;line-height:1;color:var(--gold);margin-top:10px}
.hero .days small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#cfc6b4;margin-top:6px}
.hero p{color:#cfc6b4;font-size:13.5px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.05}
.stat span{font-size:11px;color:var(--muted)}
.stat.red b{color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.bar.over i{background:var(--warn)}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none;font-size:14px;font-weight:600}
.item .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:1.6px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:15px;line-height:1;text-align:center}
.check.on{background:var(--gold);border-color:var(--gold)}
.done b{text-decoration:line-through;color:var(--faint)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:var(--c,#6f9cc4)}
.tag{flex:none;white-space:nowrap;display:inline-block;font-size:11px;line-height:1.5;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.tag.yes{background:var(--okbg);border-color:transparent;color:var(--ok)}
.tag.no{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.tag.soon{background:var(--ambbg);border-color:transparent;color:var(--amb)}
.tag.late{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);white-space:nowrap}
.chip.on{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--card);text-align:center}
.btn.primary{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn)}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.in{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line2);background:var(--bg);outline:none}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{margin:6px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:12px;border:1px solid var(--line2);font-size:13px;background:var(--bg);text-align:center}
.seg button.on{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .seg button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--faint);padding:6px 10px;border-radius:12px;min-width:62px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.list-kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list-kv div:last-child{border-bottom:0}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--text);font-weight:500;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#F7F1E6;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:50;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.demo-bar{background:color-mix(in srgb,var(--gold) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);text-align:center;font-size:13px;padding:10px 14px;border-radius:14px;margin:0 0 12px}
.demo-bar a{color:var(--accent);font-weight:600}
.grp{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:16px 0 2px}
.grp:first-child{margin-top:2px}
.menu .item{padding:14px 0}
.menu .item .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.table{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg)}
.table b{font-family:var(--serif);font-size:19px;font-weight:600}
.table ul{list-style:none;margin-top:6px;font-size:13px}
.table li{padding:3px 0;border-bottom:1px dashed var(--line)}
.table li.free{color:var(--faint)}
.tl{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%}
.tl:last-child{border-bottom:0}
.tl .time{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--accent)}
.tl small{display:block;color:var(--muted);font-size:12.5px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.fab{position:fixed;right:max(18px,calc(50% - 300px));bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--navy);color:#F7F1E6;font-size:28px;line-height:1;display:grid;place-items:center;text-align:center;box-shadow:0 14px 24px -10px rgba(18,24,48,.6);z-index:15}
[data-theme=dark] .fab{background:var(--gold);color:#111}
.table.pick{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.table li.sel,.item.sel{background:color-mix(in srgb,var(--gold) 18%,transparent);border-radius:8px}
.table .th{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.selbar{position:sticky;top:8px;z-index:5;background:var(--navy);color:#F7F1E6;border-radius:14px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}
[data-theme=dark] .selbar{background:var(--gold);color:#111}
.selbar button{color:inherit;text-decoration:underline;font-size:13px}
.focus{text-align:center;padding:6px 0 2px}
.focus .big{font-family:var(--serif);font-size:26px;line-height:1.15;margin:6px 0 4px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photos div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(18,24,48,.7);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
.photos .add{display:grid;place-items:center;border:1.5px dashed var(--line2);background:var(--bg);color:var(--muted);font-size:13px;text-align:center;cursor:pointer}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.swatches button.sw{width:52px;height:52px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.swatches input[type=color]{width:52px;height:52px;border:1.5px dashed var(--line2);border-radius:50%;background:var(--bg);padding:6px;cursor:pointer;-webkit-appearance:none;appearance:none}
.swatches input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.swatches input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.swatches input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.qs label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.qs label:last-child{border-bottom:0}
.qs input{width:18px;height:18px;margin-top:2px;flex:none}
#print{display:none}
@media print{
  body{background:#fff;padding:0;color:#111}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:Inter,system-ui,sans-serif;font-size:11pt;color:#111}
  #print h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30pt;font-weight:500;margin:0 0 4pt}
  #print h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:17pt;font-weight:600;margin:14pt 0 4pt}
  #print .pb{font-size:9pt;letter-spacing:.2em;text-transform:uppercase;color:#8a6f3a;margin-bottom:6pt}
  #print table{width:100%;border-collapse:collapse;margin-top:8pt}
  #print th,#print td{text-align:left;padding:5pt 6pt;border-bottom:1px solid #ddd;vertical-align:top}
  #print th{font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;color:#666}
  #print .cards{display:grid;grid-template-columns:1fr 1fr;gap:14pt}
  #print .tc{border:1.5px solid #c9a464;border-radius:10pt;padding:22pt 16pt;text-align:center;break-inside:avoid;min-height:210pt}
  #print .tc b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:34pt;font-weight:500;margin-bottom:8pt}
  #print .cols{columns:2;column-gap:24pt}
  #print .cols div{break-inside:avoid;padding:3pt 0;border-bottom:1px dotted #ccc;display:flex;justify-content:space-between;gap:10pt}
  #print .box{display:inline-block;width:10pt;height:10pt;border:1px solid #888;margin-right:6pt;vertical-align:-1pt}
}
</style>
</head>
<body>
<div id="main"></div>
<nav class="nav" id="nav"></nav>
<div id="print"></div>
<input type="file" id="file" accept=".json,.csv,application/json,text/csv" style="display:none">
<input type="file" id="photo" accept="image/*" multiple style="display:none">
<script>
/* Calm Wedding Planner: web app by Her Midnight Edit. Everything is saved in this browser only (localStorage). */
var KEY='calmWedding.v1';
var store=null; try{ store=window.localStorage; store.setItem('__cw','1'); store.removeItem('__cw'); }catch(e){ store=null; }

/* ---------- demo ---------- */
var DEMO_MODE=true;             // true = free demo build (sample wedding, nothing saved)
var FULL_VERSION_LINK='https://www.etsy.com/shop/HerMidnightEdit';   // your Etsy listing link, shown in demo mode

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var COLORS=['#6f9cc4','#6f9a7e','#8c84bd','#d9896a','#c97f8c','#8a6f3a','#4f6d8f','#7b8fb0'];
var CURRENCIES=[['USD','$ US dollar'],['CAD','$ Canadian dollar'],['AUD','$ Australian dollar'],['GBP','£ British pound'],['EUR','€ Euro'],['NZD','$ NZ dollar']];
var CATS=[['Venue',15],['Catering',25],['Photography',10],['Videography',5],['Attire',6],['Hair & makeup',3],['Flowers & decor',8],['Entertainment',4],['Ceremony',2],['Stationery',3],['Cake & desserts',3],['Rings',4],['Transport',2],['Favors & gifts',3],['Contingency',5],['Other',2]];
var GROUPS=['Family','Friends','Work','Neighbors','Plus ones','Children'], MEALS=['Chicken','Beef','Fish','Vegetarian','Vegan','Kids’ meal'];
var TASKS=[[365,['Set your budget','Draft the guest list','Choose your date','Book the venue','Decide if you want a planner']],[300,['Book the photographer','Book the videographer','Book the caterer','Choose your wedding party','Start a wedding website']],
  [240,['Book the officiant','Shop for wedding outfits','Send save-the-dates','Reserve hotel rooms for guests','Book entertainment']],[180,['Book the florist','Order the cake','Book hair & makeup','Plan the honeymoon','Book transport','Order invitations']],
  [120,['Buy the wedding rings','Book the menu tasting','Plan the rehearsal dinner','Buy wedding party gifts','Choose favors']],[90,['Finalize the menu','First outfit fitting','Write your vows','Confirm ceremony details']],
  [60,['Send invitations','Hair & makeup trial','Buy accessories','Plan the order of the day']],[30,['RSVP deadline','Final guest count to the caterer','Finish the seating plan','Final outfit fitting','Get the marriage license','Write the wedding-day timeline']],
  [14,['Confirm every vendor','Pay final balances','Pack for the honeymoon','Break in your shoes']],[7,['Share the timeline with vendors and wedding party','Prepare tip envelopes','Pack the wedding-day bag']],[1,['Rehearsal','Rest, eat well, drink water','Charge your phone and camera']],[-14,['Send thank-you cards','Return rentals','Leave reviews for your vendors']]];
var TIMELINE=[['9:00 AM','Hair & makeup begins'],['11:30 AM','Photographer arrives'],['12:30 PM','Getting dressed'],['1:00 PM','First look & couple photos'],['2:30 PM','Guests arrive'],['3:00 PM','Ceremony begins'],['3:30 PM','Family & group photos'],['4:00 PM','Welcome reception'],['5:30 PM','Guests take their seats'],['5:45 PM','Grand entrance'],['6:00 PM','Dinner is served'],['7:30 PM','Speeches'],['8:00 PM','Cake cutting'],['8:30 PM','Dessert & tea'],['10:30 PM','Send-off']];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parseD(s){ var p=String(s||'').split('-'); return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null; }
function fmtDate(s,long){ var d=parseD(s); if(!d) return ''; return long?['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function daysUntil(s){ var d=parseD(s); if(!d) return null; var t=parseD(today()); return Math.round((d-t)/864e5); }
function money(n,dec){ try{ return new Intl.NumberFormat('en-US',{style:'currency',currency:S.cur||'USD',maximumFractionDigits:dec?2:0,minimumFractionDigits:dec?2:0}).format(+n||0); }catch(e){ return '$'+Math.round(+n||0); } }
function num(v){ v=parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')); return isNaN(v)?0:v; }
function initials(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
function hash(s){ var h=0; s=String(s||''); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }

var PACK=['Wedding rings','Vows or speech notes','Marriage license','Printed wedding-day timeline','Vendor phone numbers','Tip envelopes','Emergency cash','Phone charger','Tissues','Safety pins','Mini sewing kit','Stain remover pen','Pain relievers','Bandages and blister pads','Deodorant','Hairbrush and hair pins','Makeup for touch-ups','Lip balm','Breath mints','Water and snacks','Comfortable shoes','Umbrella'];
var VQ={
  'Venue':['How many guests can it hold?','What is included: tables, chairs, linens?','Is there a rain plan?','When can we set up, and when must we leave?','Can we bring our own caterer?','What is the deposit and payment schedule?'],
  'Catering':['What is the price per guest?','Can you handle dietary needs and allergies?','Is a tasting included?','Are staff, plates and cutlery included?','When do you need the final guest count?'],
  'Photography':['How many hours are included?','How many edited photos will we get, and when?','Is a second photographer included?','Can we see a full wedding gallery?','What happens if you are ill on the day?'],
  'Videography':['How long is the final film?','Will we get the raw footage?','When will we get the video?'],
  'Flowers & decor':['Can you work with our budget?','Do you deliver and set up?','Can ceremony flowers move to the reception?','What is in season on our date?'],
  'Hair & makeup':['Is a trial included?','How many people can you do, and how long each?','Do you come to us? Is there a travel fee?'],
  'Cake & desserts':['Is a tasting included?','How many servings do we need?','Are delivery and setup included?','Can you make allergy-friendly options?'],
  'Entertainment':['How long do you perform?','What space or equipment do you need?','Can we see a recent performance?'],

function download(name,text,type){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); }
function guestCSV(){ var q=function(x){ x=String(x==null?'':x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  return [['Name','Group','Side','RSVP','Meal','Table','Plus one','Save-the-date sent','Invitation sent','Phone','Email','Gift','Thank-you sent','Notes'].join(',')].concat(S.guests.map(function(g){ var t=g.table&&find('tables',g.table); return [g.name,g.group,g.side,g.rsvp,g.meal,t?t.name:'',g.plus?'Yes':'',g.std?'Yes':'',g.inv?'Yes':'',g.phone,g.email,g.gift,g.thanks?'Yes':'',g.notes].map(q).join(','); })).join('\n'); }
document.getElementById('file').addEventListener('change',function(){ var f=this.files[0], mode=fileMode; fileMode=''; if(!f) return; var r=new FileReader(); r.onload=function(){ var text=String(r.result||'').replace(/^﻿/,'');
  if(mode==='csv'){ var n=importGuests(text); save(); toast(n?n+' guests imported':'No new guests found in that file'); V.gf='all'; return go('guests'); }
  try{ var d=JSON.parse(text); if(!d.tasks||!d.guests) throw 0;
    if(mode==='merge'){ var n2=mergeIn(d); save(); toast('Joined. '+n2+' new '+(n2===1?'thing':'things')+' from your partner'); return go('home'); }
    if(!confirm('Replace everything here with this backup?')) return; S=normalize(d); save(); toast('Backup restored'); go('home'); }catch(e){ toast('That file isn’t a Calm Wedding backup'); } }; r.readAsText(f); });
document.getElementById('photo').addEventListener('change',function(){ var fs=[].slice.call(this.files||[]), room=30-S.board.photos.length; if(!fs.length) return; if(fs.length>room) toast('Room for '+room+' more photos'); fs=fs.slice(0,room); var left=fs.length;
  fs.forEach(function(file){ shrink(file,function(src){ if(src) S.board.photos.push({id:uid(),src:src,u:Date.now()}); if(--left===0){ save(); render(); } }); }); });
function shrink(file,cb){ var url=URL.createObjectURL(file), img=new Image(); img.onload=function(){ var m=720, s=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',0.72)); }; img.onerror=function(){ URL.revokeObjectURL(url); toast('One photo couldn’t be opened'); cb(null); }; img.src=url; }

// listing photos only: demo?shot=home|tasks|guests|seating|budget|vendors|timeline&theme=dark
var QP=new URLSearchParams(location.search);
if(DEMO_MODE&&QP.get('shot')){ window.demoBar=function(){ return ''; }; if(QP.get('theme')) S.theme=QP.get('theme'); V.view=QP.get('shot'); }
render();
if(DEMO_MODE&&QP.get('scroll')) setTimeout(function(){ window.scrollTo(0,+QP.get('scroll')); },300);
if(!store&&!DEMO_MODE) setTimeout(function(){ toast('Private mode: your plans won’t be saved'); },800);
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
